    <h1>0号公路</h1>
    <div class="meta">Highway 0 · 2025</div>
    <div class="reading-content">
      <p class="poem-line">从城市边缘出发</p>
      <p class="poem-line">路变得越来越窄</p>
      <p class="poem-line">两边的树开始认识我</p>
      <br>
      <p class="poem-line">电台信号渐渐微弱</p>
      <p class="poem-line">只剩下风的声音</p>
      <p class="poem-line">和轮胎压过碎石的响</p>
      <br>
      <p class="poem-line">有人说</p>
      <p class="poem-line">0号公路通向北方</p>
      <p class="poem-line">也通向更安静的自己</p>
    </div>
