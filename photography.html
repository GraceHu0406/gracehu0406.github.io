      1. 把照片放到 <code>images/</code> 文件夹<br>
      2. 把上面的灰色占位改成：<br>
      <code>&lt;img src="images/你的照片.jpg" alt="描述"&gt;</code><br>
      建议先用 TinyPNG 压缩图片。
