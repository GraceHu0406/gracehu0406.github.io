    <div style="max-width:600px; margin:0 auto; line-height:1.9; color:var(--text-secondary);">
      <p>《万物生》是一个长期进行的创作计划。</p>
      <p>它以加拿大的土地、森林、河流、季节与人为观察对象，用诗歌、散文与影像记录「活着」的各种形态——生长、迁徙、消逝、重生。</p>
      <p>这个项目没有固定的结束时间。它会随着我走过的路、看见的风景、想到的句子，一点点积累下来。</p>
      <p style="margin-top:32px;">目前已有的部分作品可在「诗歌」与「摄影」页面中阅读与观看。更多内容会持续更新。</p>
